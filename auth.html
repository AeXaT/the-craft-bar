<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Register – The Craft Bar</title>
  <meta name="description" content="Login or create an account at The Craft Bar to save your favourite cocktails." />
  <meta name="robots" content="index, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./contact.css" />
  <style>
    .auth-wrap { max-width: 540px; margin: 0 auto; }
    .auth-tabs {
      display: flex; margin-bottom: 30px;
      border-bottom: 1px solid rgba(212,160,67,0.3);
    }
    .auth-tab {
      flex: 1; padding: 14px; background: none; border: none; color: #e8d5b0;
      font-size: 15px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px; transition: 0.3s;
      font-family: inherit;
    }
    .auth-tab.active { color: #d4a043; border-bottom-color: #d4a043; }
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
    .form-container {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(212,160,67,0.2);
      border-radius: 8px; padding: 36px 40px;
    }
    .input-box { display: flex; flex-direction: column; margin-bottom: 20px; }
    .input-box label {
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      color: #d4a043; margin-bottom: 7px;
    }
    .input-box input, .input-box select {
      background: rgba(255,255,255,0.06);
      border: none; border-bottom: 1px solid rgba(212,160,67,0.3);
      padding: 10px; color: #e8d5b0; font-size: 15px;
      outline: none; transition: 0.3s; font-family: inherit;
    }
    .input-box input:focus, .input-box select:focus { border-bottom-color: #d4a043; }
    .input-box select option { background: #1a1008; color: #e8d5b0; }
    .input-row { display: flex; gap: 16px; }
    .input-row .input-box { flex: 1; }
    .input-optional { font-size: 10px; opacity: 0.4; margin-left: 6px; text-transform: none; letter-spacing: 0; }
    .auth-note { text-align: center; margin-top: 20px; opacity: 0.5; font-size: 13px; }
    .auth-error {
      background: rgba(220,50,50,0.12); border: 1px solid rgba(220,50,50,0.3);
      border-radius: 5px; padding: 10px 14px; margin-bottom: 18px;
      color: #e07070; font-size: 13px; display: none; line-height: 1.5;
    }
    .auth-error.visible { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>emailjs.init("jd5MSWIbWIqEGG9OB");</script>
</head>
<body>

  <!-- navbar -->
  <div class="navbar">
    <a href="./index.html" class="logo">The Craft <span>Bar</span><svg width="44" height="44" viewBox="30 35 420 395" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;"><path d="M220 390V180C220 150 250 140 270 120V60H245" stroke="#d4a043" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 120C305 125 320 145 320 170" stroke="#d4a043" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 250H410L250 410H350" stroke="#d4a043" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 250C290 285 330 300 350 330" stroke="#d4a043" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <nav id="mainNav">
      <a href="./index.html">Home</a>
      <a href="./cocktails.html">Cocktails</a>
      <a href="./equipment.html">Equipment</a>
      <a href="./auth.html" id="authNavLink" class="active">Login</a>
    </nav>
    <label class="menuButton">
      <input type="checkbox" id="check" onclick="toggleNav()" />
      <span class="top"></span>
      <span class="mid"></span>
      <span class="bot"></span>
    </label>
  </div>

  <!-- page header -->
  <div class="page-header">
    <div class="page-header-content">
      <h1>My Account</h1>
      <p>Login or create an account to save your favourites</p>
    </div>
  </div>

  <section>
    <div class="auth-wrap">
      <div class="auth-tabs">
        <button class="auth-tab active" data-panel="loginPanel">Login</button>
        <button class="auth-tab" data-panel="registerPanel">Register</button>
      </div>

      <!-- ── Login ─────────────────────────────────────────── -->
      <div id="loginPanel" class="auth-panel active">
        <div class="form-container">
          <div id="loginError" class="auth-error"></div>
          <form id="loginForm">
            <div class="input-box">
              <label>Email Address</label>
              <input type="email" id="loginEmail" placeholder="alex@example.com" required />
            </div>
            <div class="input-box">
              <label>Password</label>
              <input type="password" id="loginPass" placeholder="Your password" required />
            </div>
            <div style="text-align:center;margin-top:14px;">
              <button type="submit" class="btn-gold" id="loginBtn">Login</button>
            </div>
          </form>
          <p class="auth-note">Don't have an account? Click Register above.</p>
        </div>
      </div>

      <!-- ── Register ───────────────────────────────────────── -->
      <div id="registerPanel" class="auth-panel">
        <div class="form-container">
          <div id="registerError" class="auth-error"></div>
          <form id="registerForm">
            <div class="input-row">
              <div class="input-box">
                <label>First Name</label>
                <input type="text" id="regFirstName" placeholder="Alex" required />
              </div>
              <div class="input-box">
                <label>Last Name</label>
                <input type="text" id="regLastName" placeholder="Smith" required />
              </div>
            </div>
            <div class="input-row">
              <div class="input-box">
                <label>Age</label>
                <input type="number" id="regAge" placeholder="25" min="1" max="120" required />
              </div>
              <div class="input-box">
                <label>Gender</label>
                <select id="regGender" required>
                  <option value="">Select...</option>
                  <option value="MALE">Male</option>
                  <option value="FEMALE">Female</option>
                </select>
              </div>
            </div>
            <div class="input-box">
              <label>Email Address</label>
              <input type="email" id="regEmail" placeholder="alex@example.com" required />
            </div>
            <div class="input-box">
              <label>Password <span style="font-size:10px;opacity:0.5;">(min 8 characters)</span></label>
              <input type="password" id="regPass" placeholder="Create a password" required minlength="8" />
            </div>
            <div class="input-box">
              <label>Address</label>
              <input type="text" id="regAddress" placeholder="123 Main St, City" required />
            </div>
            <div class="input-row">
              <div class="input-box">
                <label>Phone</label>
                <input type="tel" id="regPhone" placeholder="+1234567890" required />
              </div>
              <div class="input-box">
                <label>Zipcode</label>
                <input type="text" id="regZipcode" placeholder="10001" required />
              </div>
            </div>
            <div class="input-box">
              <label>Avatar URL <span class="input-optional">(optional)</span></label>
              <input type="url" id="regAvatar" placeholder="https://example.com/photo.jpg" />
            </div>
            <div style="text-align:center;margin-top:14px;">
              <button type="submit" class="btn-gold" id="registerBtn">Create Account</button>
            </div>
          </form>
          <p class="auth-note">Already have an account? Click Login above.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- footer -->
  <footer>
    <a href="./index.html" class="footer-logo">The Craft Bar</a>
    <div class="footer-copy">© 2025 The Craft Bar. All rights reserved.</div>
  </footer>

  <script src="./burger.js"></script>
  <script src="./script.js"></script>
</body>
</html>
