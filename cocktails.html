<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cocktail Recipes – The Craft Bar</title>
  <meta name="description" content="Browse hundreds of cocktail recipes — from classic Old Fashioneds to modern craft drinks. Search and filter by ingredient or category." />
  <meta name="keywords" content="cocktail recipes, Old Fashioned, Negroni, Margarita, Daiquiri, mixology, cocktail search" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="The Craft Bar – Cocktail Recipes" />
  <meta property="og:description" content="Your ultimate guide to cocktails, spirits, and the art of mixology." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=1200" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./cocktails.css" />
</head>
<body>

  <!-- navbar -->
  <div class="navbar">
    <a href="./index.html" class="logo">The Craft <span>Bar</span></a>
    <nav id="mainNav" style="margin-left:auto;">
      <a href="./index.html">Home</a>
      <a href="./cocktails.html" class="active">Cocktails</a>
      <a href="./equipment.html">Equipment</a>
      <a href="./contact.html">Contact</a>
      <a href="./auth.html" id="authNavLink">Login</a>
    </nav>
    <div style="display:contents;">
      <button id="favNavBtn" onclick="toggleFavDrawer()" class="fav-nav-btn" style="display:none;">
        ❤️ <span id="favCount"></span>
      </button>
      <label class="menuButton">
        <input type="checkbox" id="check" onclick="toggleNav()" />
        <span class="top"></span>
        <span class="mid"></span>
        <span class="bot"></span>
      </label>
    </div>
  </div>

  <!-- favourites drawer -->
  <div id="favDrawer" class="fav-drawer">
    <div class="fav-drawer-header">
      <h3>❤️ My Favourites</h3>
      <button onclick="toggleFavDrawer()">✕</button>
    </div>
    <div id="favList"></div>
  </div>
  <div class="fav-overlay" onclick="toggleFavDrawer()"></div>

  <!-- page header -->
  <div class="page-header">
    <div class="page-header-content">
      <h1>Cocktail Recipes</h1>
      <p>From timeless classics to modern craft creations</p>
    </div>
  </div>

  <!-- cocktails section -->
  <section>
    <!-- search + filters only, no Add button -->
    <div class="filters-bar">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search cocktails..." onkeyup="searchCocktails()" />
        <button onclick="searchCocktails()">Search</button>
      </div>
      <div class="filter-selects">
        <select id="categoryFilter">
          <option value="">All Categories</option>
        </select>
        <select id="ingredientFilter">
          <option value="">All Ingredients</option>
          <!-- populated from API -->
        </select>
      </div>
    </div>

    <div id="loader" class="loader" style="display:none;">
      <div class="loader-spinner"></div>
      <p>Loading cocktails...</p>
    </div>

    <div class="cards-grid" id="cocktailGrid"></div>
  </section>

  <!-- Detail popup -->
  <div id="detailOverlay" class="modal-overlay">
    <div class="detail-modal">
      <button class="detail-close-btn" onclick="closeDetailModal()">✕</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- footer -->
  <footer>
    <a href="./index.html" class="footer-logo">The Craft Bar</a>
    <div class="footer-copy">© 2025 The Craft Bar. All rights reserved.</div>
  </footer>

  <script src="./burger.js"></script>
  <script src="./script.js"></script>
</body>
</html>
