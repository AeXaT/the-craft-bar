<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile – The Craft Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { background:#1a1008; color:#e8d5b0; font-family:'Lato',sans-serif; min-height:100vh; }
    a { text-decoration:none; color:inherit; }

    /* ── Navbar ───────────────────────────────────────────── */
    .navbar {
      position:fixed; top:0; width:100%; z-index:9999;
      padding:18px 60px;
      display:flex; justify-content:space-between; align-items:center;
      background:rgba(15,8,2,0.9); backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(212,160,67,0.2);
    }
    .logo { font-family:'IM Fell English',serif; font-style:italic; font-size:26px; font-weight:400; color:#d4a043; letter-spacing:2px; text-transform:none; }
    .logo span { color:#e8d5b0; font-weight:400; font-size:inherit; }
    .logo { display:flex; align-items:center; gap:6px; }
    nav { display:flex; gap:30px; align-items:center; }
    nav a { color:#e8d5b0; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; position:relative; transition:0.3s; }
    nav a::after { content:''; position:absolute; width:0; height:1px; bottom:-3px; left:0; background:#d4a043; transition:0.3s; }
    nav a:hover, nav a.active { color:#d4a043; }
    nav a:hover::after, nav a.active::after { width:100%; }
    .menuButton { display:none; flex-direction:column; justify-content:center; align-items:center; gap:5px; width:40px; height:40px; cursor:pointer; z-index:100001; }
    .menuButton span { width:25px; height:3px; background:#d4a043; border-radius:3px; transition:0.3s; }
    input[type="checkbox"] { display:none; }
    input[type]:checked ~ span.top { transform:translateY(8px) rotate(45deg); }
    input[type]:checked ~ span.bot { transform:translateY(-8px) rotate(-45deg); }
    input[type]:checked ~ span.mid { opacity:0; transform:translateX(-20px); }

    /* ── Page header ──────────────────────────────────────── */
    .page-header {
      background:url('https://images.unsplash.com/photo-1470337458703-46ad1756a187?w=1600') center/cover;
      min-height:30vh; display:flex; align-items:flex-end;
      padding:40px 60px; position:relative;
    }
    .page-header::before { content:''; position:absolute; inset:0; background:linear-gradient(to top,#1a1008 10%,rgba(15,8,2,0.6)); }
    .page-header h1 { position:relative; z-index:1; font-family:'Playfair Display',serif; font-size:clamp(28px,5vw,52px); color:#d4a043; letter-spacing:4px; text-transform:uppercase; }

    /* ── Outer wrapper ────────────────────────────────────── */
    .outer {
      max-width:1100px;
      margin:0 auto;
      padding:50px 40px 80px;
      /* Use CSS table for rock-solid side-by-side layout */
      display:table;
      width:100%;
      table-layout:fixed;
    }

    /* ── Sidebar ──────────────────────────────────────────── */
    .sidebar {
      display:table-cell;
      width:190px;
      vertical-align:top;
      padding-right:24px;
    }

    .sidebar-box {
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(212,160,67,0.2);
      border-radius:10px;
    }

    .sidebar-top {
      text-align:center;
      padding:24px 14px 18px;
      border-bottom:1px solid rgba(212,160,67,0.15);
    }
    .sidebar-avatar {
      width:76px; height:76px; border-radius:50%;
      object-fit:cover; border:3px solid rgba(212,160,67,0.45);
      display:block; margin:0 auto 11px;
    }
    .sidebar-name  { font-family:'Playfair Display',serif; font-size:15px; color:#d4a043; margin-bottom:4px; word-break:break-word; }
    .sidebar-email { font-size:11px; opacity:0.45; word-break:break-all; line-height:1.5; }

    /* ── Nav buttons — each one its own block row ─────────── */
    .sidebar-nav { padding:8px 0 10px; }

    /* This is the key: each button is display:block, full width.
       No flexbox. No grid. Just blocks stacking vertically. */
    .snav {
      display:block;
      width:100%;
      padding:12px 16px;
      background:none;
      border:none;
      border-left:3px solid transparent;
      color:#e8d5b0;
      font-family:'Lato',sans-serif;
      font-size:13px;
      font-weight:400;
      text-align:left;
      cursor:pointer;
      transition:background 0.2s, color 0.2s;
      /* kill any browser button weirdness */
      -webkit-appearance:none;
      appearance:none;
      line-height:1.4;
    }
    .snav:hover  { background:rgba(212,160,67,0.09); color:#d4a043; }
    .snav.on     { background:rgba(212,160,67,0.14); color:#d4a043; border-left-color:#d4a043; }
    .snav.red    { color:#e07070; }
    .snav.red:hover { background:rgba(220,50,50,0.09); color:#e05555; }
    .snav-line   { height:1px; background:rgba(212,160,67,0.15); margin:4px 0; }

    /* ── Main column ──────────────────────────────────────── */
    .main-col {
      display:table-cell;
      vertical-align:top;
    }

    /* ── Panels ───────────────────────────────────────────── */
    .pnl { display:none; }
    .pnl.on { display:block; }

    .card {
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(212,160,67,0.2);
      border-radius:10px;
      padding:28px 30px;
      margin-bottom:22px;
    }
    .card h3 {
      font-family:'Playfair Display',serif;
      font-size:19px; color:#d4a043;
      margin-bottom:24px; padding-bottom:12px;
      border-bottom:1px solid rgba(212,160,67,0.15);
    }

    /* ── Form ─────────────────────────────────────────────── */
    .fgrid { display:table; width:100%; border-collapse:separate; border-spacing:0 0; }
    .frow  { display:table-row; }
    .fcell { display:table-cell; width:50%; padding:0 10px 22px 0; vertical-align:top; }
    .fcell:last-child { padding-right:0; }
    .fcell.full { display:block; width:100%; padding-right:0; }

    /* simpler: just use a CSS grid for the form */
    .form-grid { display:grid; grid-template-columns:1fr 1fr; column-gap:22px; }
    .form-grid .s2 { grid-column:1/-1; }

    .fld { margin-bottom:24px; }
    .fld label {
      display:block;
      font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
      color:#d4a043; opacity:0.85; margin-bottom:9px;
    }
    .fld input, .fld select {
      display:block; width:100%;
      background:rgba(255,255,255,0.06);
      border:none; border-bottom:1px solid rgba(212,160,67,0.3);
      padding:10px 6px; color:#e8d5b0; font-size:15px;
      outline:none; transition:border-color 0.3s; font-family:'Lato',sans-serif;
    }
    .fld input:focus, .fld select:focus { border-bottom-color:#d4a043; }
    .fld select option { background:#1a1008; }

    /* ── Buttons ──────────────────────────────────────────── */
    .btn-gold {
      display:inline-block; padding:13px 30px;
      background:linear-gradient(135deg,#d4a043,#a0722a);
      color:#1a1008; font-weight:bold; font-size:13px;
      letter-spacing:2px; text-transform:uppercase;
      border-radius:2px; border:none; cursor:pointer; transition:0.3s;
    }
    .btn-gold:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(212,160,67,0.4); }

    /* ── Status messages ──────────────────────────────────── */
    .msg { padding:10px 14px; border-radius:5px; font-size:13px; margin-bottom:18px; display:none; }
    .msg.ok  { display:block; background:rgba(50,180,80,0.12);  border:1px solid rgba(50,180,80,0.3);  color:#6dbb7a; }
    .msg.err { display:block; background:rgba(220,50,50,0.12);  border:1px solid rgba(220,50,50,0.3);  color:#e07070; }

    /* ── Avatar ───────────────────────────────────────────── */
    .av-row { display:flex; align-items:center; gap:14px; }
    .av-img  { width:58px; height:58px; border-radius:50%; object-fit:cover; border:2px solid rgba(212,160,67,0.35); flex-shrink:0; }
    .av-inputs { flex:1; display:flex; flex-direction:column; gap:6px; }
    .av-inputs input[type="url"] {
      background:rgba(255,255,255,0.06); border:none; border-bottom:1px solid rgba(212,160,67,0.3);
      padding:9px 6px; color:#e8d5b0; font-size:14px; outline:none; font-family:'Lato',sans-serif;
    }
    .btn-file {
      display:inline-flex; align-items:center; gap:6px; padding:8px 14px;
      background:rgba(212,160,67,0.1); border:1px solid rgba(212,160,67,0.35);
      color:#d4a043; border-radius:4px; cursor:pointer; font-size:12px; font-family:'Lato',sans-serif;
    }
    .btn-file:hover { background:rgba(212,160,67,0.2); }
    #avatarFileInput { display:none; }

    /* ── Favourites ───────────────────────────────────────── */
    .fav-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }

    .fav-card {
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(212,160,67,0.15);
      border-radius:10px; overflow:hidden;
      transition:transform 0.25s, border-color 0.25s, box-shadow 0.25s;
      display:flex; flex-direction:column;
    }
    .fav-card:hover { border-color:#d4a043; transform:translateY(-4px); box-shadow:0 10px 30px rgba(0,0,0,0.4); }

    /* image: fixed 4:3 ratio, always fills */
    .fav-thumb {
      position:relative;
      width:100%;
      padding-top:72%;   /* 4:3-ish ratio */
      overflow:hidden;
      cursor:pointer;
      flex-shrink:0;
    }
    .fav-thumb img {
      position:absolute; top:0; left:0;
      width:100%; height:100%;
      object-fit:cover; object-position:center;
      transition:transform 0.35s ease;
    }
    .fav-card:hover .fav-thumb img { transform:scale(1.04); }

    /* gradient overlay on image */
    .fav-thumb::after {
      content:'';
      position:absolute; inset:0;
      background:linear-gradient(to top, rgba(26,16,8,0.5) 0%, transparent 50%);
      pointer-events:none;
    }

    .fav-body {
      padding:12px 14px 14px;
      flex:1; display:flex; flex-direction:column; gap:4px;
    }
    .fav-body h4 { font-size:14px; color:#d4a043; line-height:1.3; }
    .fav-body small { opacity:0.45; font-size:11px; letter-spacing:0.5px; }

    /* remove button: subtle, at bottom of card */
    .fav-rm {
      display:flex; align-items:center; justify-content:center; gap:6px;
      margin-top:auto; padding-top:10px;
      border:none; background:none;
      color:rgba(224,85,85,0.6);
      font-size:12px; font-family:'Lato',sans-serif;
      cursor:pointer; transition:color 0.2s;
      border-top:1px solid rgba(212,160,67,0.08);
      padding:8px 0 0;
    }
    .fav-rm:hover { color:#e05555; }

    .fav-empty { grid-column:1/-1; text-align:center; padding:50px 20px; opacity:0.35; font-size:15px; line-height:2; }

    /* ── Footer ───────────────────────────────────────────── */
    footer { background:rgba(0,0,0,0.6); border-top:1px solid rgba(212,160,67,0.15); padding:36px 60px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
    .footer-logo { font-size:19px; color:#d4a043; letter-spacing:3px; }
    .footer-copy { font-size:12px; opacity:0.4; }

    /* ── Detail modal ─────────────────────────────────────── */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.82); z-index:99999; align-items:center; justify-content:center; backdrop-filter:blur(5px); }
    .modal-overlay.open { display:flex; }
    .detail-modal { background:#1e1208; border:1px solid rgba(212,160,67,0.35); border-radius:12px; display:flex; flex-direction:column; width:calc(100% - 40px); max-width:540px; max-height:90vh; overflow-y:auto; position:relative; }
    .detail-close-btn { position:absolute; top:12px; right:14px; background:rgba(0,0,0,0.6); border:none; color:#e8d5b0; font-size:15px; cursor:pointer; z-index:10; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
    .detail-close-btn:hover { background:rgba(212,160,67,0.35); color:#d4a043; }
    .detail-img-wrap { width:100%; background:#140d05; position:relative; }
    .detail-img-wrap img { width:100%; height:auto; display:block; object-fit:contain; }
    .detail-img-gradient { position:absolute; bottom:0; left:0; right:0; height:80px; background:linear-gradient(to top,#1e1208,transparent); }
    .detail-badges { position:absolute; bottom:12px; left:12px; display:flex; flex-direction:column; gap:5px; z-index:2; }
    .detail-info { padding:22px 26px 28px; }
    .detail-title { font-family:'Playfair Display',serif; font-size:clamp(17px,3vw,23px); color:#d4a043; margin-bottom:14px; }
    .detail-section { margin-bottom:14px; }
    .detail-section h4 { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#d4a043; margin-bottom:8px; opacity:0.7; }
    .detail-ingredients { display:flex; flex-direction:column; gap:5px; }
    .detail-ingredient { display:flex; justify-content:space-between; padding:7px 10px; background:rgba(255,255,255,0.04); border:1px solid rgba(212,160,67,0.12); border-radius:5px; }
    .detail-ing-name { font-size:13px; }
    .detail-ing-measure { font-size:12px; color:#d4a043; font-weight:bold; }
    .detail-instructions { font-size:13px; line-height:1.8; opacity:0.8; }
    .card-tag { display:inline-block; padding:4px 10px; background:rgba(212,160,67,0.15); color:#d4a043; border-radius:20px; font-size:11px; }
    .loader-spinner { width:38px; height:38px; border:3px solid rgba(212,160,67,0.2); border-top-color:#d4a043; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Toast ────────────────────────────────────────────── */
    #toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px); background:#d4a043; color:#1a1008; padding:12px 26px; border-radius:30px; font-weight:bold; font-size:13px; z-index:999999; opacity:0; transition:0.3s; pointer-events:none; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #toast.warning { background:#e05555; color:#fff; }

    /* ── Mobile ───────────────────────────────────────────── */
    @media (max-width:820px) {
      .navbar { padding:16px 20px; }
      .page-header { padding:30px 20px; }
      .outer { display:block; padding:30px 20px 60px; }
      .sidebar { display:block; width:100%; padding-right:0; margin-bottom:24px; }
      .main-col { display:block; width:100%; }
      .sidebar-nav { display:flex; flex-wrap:wrap; gap:4px; padding:8px; }
      .snav { width:auto; flex:1; min-width:100px; border-left:none; border-bottom:2px solid transparent; border-radius:4px; text-align:center; padding:10px 8px; }
      .snav.on { border-left:none; border-bottom-color:#d4a043; }
      .snav-line { display:none; }
      .fav-grid { grid-template-columns:1fr 1fr; }
      .form-grid { grid-template-columns:1fr; }
      .form-grid .s2 { grid-column:1; }
      nav { position:fixed; top:0; right:-280px; left:auto; width:260px; height:100vh; background:rgba(15,8,2,0.9); backdrop-filter:blur(20px); border-left:1px solid rgba(212,160,67,0.2); flex-direction:column; justify-content:center; align-items:center; gap:28px; padding:100px 36px 40px; transition:right 0.4s ease; z-index:100000; }
      nav a { font-size:20px; text-align:center; width:100%; }
      nav.open { right:0; }
      .menuButton { display:flex; }
      footer { flex-direction:column; text-align:center; padding:28px 20px; }

    }
    @media (max-width:480px) {
      .fav-grid { grid-template-columns:1fr; }
      .card { padding:18px 14px; }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="./index.html" class="logo">The Craft <span>Bar</span><svg width="44" height="44" viewBox="30 35 420 395" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;"><path d="M220 390V180C220 150 250 140 270 120V60H245" stroke="#d4a043" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 120C305 125 320 145 320 170" stroke="#d4a043" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 250H410L250 410H350" stroke="#d4a043" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 250C290 285 330 300 350 330" stroke="#d4a043" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <nav id="mainNav">
      <a href="./index.html">Home</a>
      <a href="./cocktails.html">Cocktails</a>
      <a href="./equipment.html">Equipment</a>
      <a href="./profile.html" class="active" id="authNavLink">Profile</a>
    </nav>
    <label class="menuButton">
      <input type="checkbox" id="check" onclick="toggleNav()" />
      <span class="top"></span><span class="mid"></span><span class="bot"></span>
    </label>
  </div>

  <div class="page-header">
    <h1>My Profile</h1>
  </div>

  <div class="outer">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-box">
        <div class="sidebar-top">
          <img id="sidebarAvatar" class="sidebar-avatar"
               src="https://ui-avatars.com/api/?background=d4a043&color=1a1008&name=U" alt="Avatar" />
          <div class="sidebar-name"  id="sidebarName">Loading...</div>
          <div class="sidebar-email" id="sidebarEmail"></div>
        </div>
        <div class="sidebar-nav">
          <button class="snav on"  data-panel="panelInfo">My Info</button>
          <button class="snav"     data-panel="panelFavourites">Favourites</button>
          <button class="snav"     data-panel="panelPassword">Change Password</button>
          <div class="snav-line"></div>
          <button class="snav red" onclick="doLogout()">Logout</button>
        </div>
      </div>
    </div>

    <!-- Main -->
    <div class="main-col">

      <!-- My Info -->
      <div id="panelInfo" class="pnl on">
        <div class="card">
          <h3>Personal Information</h3>
          <div id="infoMsg" class="msg"></div>
          <form id="infoForm">
            <div class="form-grid">
              <div class="fld"><label>First Name</label><input type="text" id="infoFirstName" required /></div>
              <div class="fld"><label>Last Name</label><input type="text" id="infoLastName" required /></div>
              <div class="fld"><label>Age</label><input type="number" id="infoAge" min="1" max="120" required /></div>
              <div class="fld">
                <label>Gender</label>
                <select id="infoGender" required>
                  <option value="MALE">Male</option>
                  <option value="FEMALE">Female</option>
                </select>
              </div>
              <div class="fld s2"><label>Email Address</label><input type="email" id="infoEmail" required /></div>
              <div class="fld s2"><label>Address</label><input type="text" id="infoAddress" required /></div>
              <div class="fld"><label>Phone</label><input type="tel" id="infoPhone" required /></div>
              <div class="fld"><label>Zipcode</label><input type="text" id="infoZipcode" required /></div>
              <div class="fld s2">
                <label>Avatar</label>
                <div class="av-row">
                  <img id="avatarPreview" class="av-img"
                       src="https://ui-avatars.com/api/?background=d4a043&color=1a1008&name=U" alt="Preview" />
                  <div class="av-inputs">
                    <input type="url" id="infoAvatar" placeholder="Paste image URL..." oninput="previewAvatar(this.value)" />
                    <button type="button" class="btn-file" onclick="document.getElementById('avatarFileInput').click()">+ Choose from device</button>
                    <input type="file" id="avatarFileInput" accept="image/*" onchange="handleAvatarFile(this)" />
                  </div>
                </div>
              </div>
            </div>
            <div style="text-align:right;margin-top:4px;">
              <button type="submit" class="btn-gold" id="infoBtn">Save Changes</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Favourites -->
      <div id="panelFavourites" class="pnl">
        <div class="card">
          <h3>My Favourites</h3>
          <div class="fav-grid" id="profileFavGrid"></div>
        </div>
      </div>

      <!-- Change Password -->
      <div id="panelPassword" class="pnl">
        <div class="card">
          <h3>Change Password</h3>
          <div id="passMsg" class="msg"></div>
          <form id="passForm" style="max-width:370px;">
            <div class="fld"><label>Current Password</label><input type="password" id="currentPass" required /></div>
            <div class="fld"><label>New Password <span style="font-size:10px;opacity:0.5;text-transform:none;letter-spacing:0;">(min 8 chars)</span></label><input type="password" id="newPass" required minlength="8" /></div>
            <div class="fld"><label>Confirm New Password</label><input type="password" id="confirmPass" required minlength="8" /></div>
            <button type="submit" class="btn-gold" id="passBtn">Update Password</button>
          </form>
        </div>
      </div>

    </div><!-- end main-col -->
  </div><!-- end outer -->

  <!-- Detail popup -->
  <div id="detailOverlay" class="modal-overlay">
    <div class="detail-modal">
      <button class="detail-close-btn" onclick="closeDetailModal()">✕</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <div id="toast"></div>

  <footer>
    <a href="./index.html" class="footer-logo">The Craft Bar</a>
    <div class="footer-copy">© 2025 The Craft Bar. All rights reserved.</div>
  </footer>

  <script src="./burger.js"></script>
  <script src="./script.js"></script>
  <script>
    function handleAvatarFile(input) {
      if (!input.files || !input.files[0]) return;
      const url = URL.createObjectURL(input.files[0]);
      document.getElementById('avatarPreview').src = url;
      document.getElementById('infoAvatar').placeholder = input.files[0].name + ' selected';
      document.getElementById('infoAvatar').dataset.objectUrl = url;
      document.getElementById('infoAvatar').value = '';
    }
  </script>
</body>
</html>
